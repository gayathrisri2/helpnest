
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpNest | Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">HelpNest</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="register.html" class="nav-button">Register</a>
        </div>
    </nav>

    <main class="auth-container">
        <section class="auth-card">

            <div class="auth-header">
                <div class="feature-icon">🔐</div>
                <h1>Welcome Back!</h1>
                <p>Login to your HelpNest account</p>
            </div>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <p id="formMessage" class="message" aria-live="polite"></p>

                <button type="submit" class="btn btn-primary auth-submit">
                    Login
                </button>

            </form>

            <p class="auth-switch">
                Don't have an account?
                <a href="register.html">Create an account</a>
            </p>

            <a href="index.html" class="back-home">← Back to Home</a>

        </section>
    </main>

    <footer class="home-footer">
        <p>© 2026 HelpNest. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
