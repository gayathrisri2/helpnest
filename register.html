
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HelpNest | Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <a href="index.html" class="logo">HelpNest</a>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
            <a href="login.html" class="nav-button">Login</a>
        </div>
    </nav>

    <main class="auth-container">
        <section class="auth-card">

            <div class="auth-header">
                <div class="feature-icon">👤</div>
                <h1>Create Account</h1>
                <p>Join HelpNest and manage your support tickets</p>
            </div>

            <form id="registerForm">

                <div class="form-group">
                    <label for="fullName">Full Name</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                    <small>Use at least 8 characters.</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Re-enter your password"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <p id="formMessage" class="message" aria-live="polite"></p>

                <button type="submit" class="btn btn-primary auth-submit">
                    Create Account
                </button>

            </form>

            <p class="auth-switch">
                Already have an account?
                <a href="login.html">Login here</a>
            </p>

            <a href="index.html" class="back-home">← Back to Home</a>

        </section>
    </main>

    <footer class="home-footer">
        <p>© 2026 HelpNest. All rights reserved.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
